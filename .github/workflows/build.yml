name: Build Scan3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone app (APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Scan3D.apk
          cd pc
          zip -r ../dist/ScanStation-PC.zip . -x "tests/*" "*__pycache__*" "scans/*" "tools/*" ".venv/*" "config.json"

      - uses: actions/upload-artifact@v4
        with:
          name: Scan3D-build-${{ github.run_number }}
          path: dist/*

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Scan3D.apk dist/ScanStation-PC.zip \
            --target "${{ github.sha }}" \
            --title "Scan3D build ${{ github.run_number }}" \
            --notes "Phone: install Scan3D.apk. PC: unzip ScanStation-PC.zip and run setup.bat."
